image: node:22

stages:
  - validate
  - test
  - build
  - nightly

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci --cache .npm --prefer-offline

quality:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - npm run lint
    - npm run typecheck
    - npm run typecheck:api

database:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - npm run test:db-integrity
    # This intentionally blocks RC promotion until an authoritative core-schema
    # baseline exists; it must not be weakened to a warning.
    - npm run verify:migrations

test_job:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - npm ci --prefix infrastructure/owner-backup
    - npm ci --prefix scripts/recovery
    - npm test

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - npm run build

codemagic_nightly:
  stage: nightly
  image: alpine:3.20
  cache: []
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
  variables:
    CODEMAGIC_APP_ID: "6a11efe7ef713f8199f4cf4a"
  script:
    - apk add --no-cache curl jq >/dev/null
    - test -n "$CODEMAGIC_API_TOKEN" || { echo "CODEMAGIC_API_TOKEN not set" >&2; exit 1; }
    - sh scripts/ci/codemagic-nightly.sh

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
